<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagicLoom - Dark Mode Multiview Habit Tracker & Discipline System</title>
  <meta name="description" content="A powerful dark-mode multiview habit tracker, weekly planner, and annual discipline dashboard matching MagicLoom spreadsheet system.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>

  <!-- Top Application Header -->
  <header class="app-header">
    <div class="brand-container">
      <div class="brand-logo">✨</div>
      <div>
        <div class="brand-title">MAGICLOOM</div>
        <div class="brand-subtitle">Discipline Tracker</div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs" role="tablist">
      <button class="nav-tab active" data-tab="monthly" id="tabMonthly">
        <span>📅</span> Monthly Grid
      </button>
      <button class="nav-tab" data-tab="weekly" id="tabWeekly">
        <span>📋</span> Weekly Planner
      </button>
      <button class="nav-tab" data-tab="yearly" id="tabYearly">
        <span>📊</span> Yearly Stats
      </button>
      <button class="nav-tab" data-tab="manager" id="tabManager">
        <span>⚙️</span> Habit Manager
      </button>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <button class="btn btn-icon" id="themeToggleBtn" title="Toggle Dark/Light Mode">
        🌓
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="main-content" id="appViewContainer">
    <!-- View content dynamically rendered by ES Modules JS -->
  </main>

  <!-- JavaScript Entry Point -->
  <script type="module" src="src/js/app.js"></script>
</body>
</html>
